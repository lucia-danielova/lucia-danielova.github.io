<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucia Danielová | Portfólio</title>
    
    <!-- Google Fonts: Elegantné pätkové Cormorant Garamond + čisté Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-image: url('podklad.png');
            --gold-light: #fef3c7;
            --gold-primary: #e2b86b;
            --gold-border: rgba(226, 184, 107, 0.4);
            --dark-bg: #05070e;
            --text-light: #f8fafc;
            --text-soft: rgba(248, 250, 252, 0.88);
            --transition-speed: 0.35s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-light);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Minimalistický podpis v rohu (bez 1/9 a bez "klikaj na kamene") */
        .site-header {
            position: fixed;
            top: 24px;
            left: 32px;
            z-index: 50;
            pointer-events: none;
        }

        .site-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
        }

        .site-header h1 span {
            font-style: italic;
            background: linear-gradient(135deg, #fffbeb 0%, #e2b86b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Hlavná scéna v pomere 16:9 s podklad.png */
        .portfolio-stage {
            position: relative;
            width: 100vw;
            height: 56.25vw;
            max-width: 1920px;
            max-height: 1080px;
            background-image: var(--bg-image), url('podklad.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 90px rgba(0, 0, 0, 0.85);
        }

        /* Interaktívne kamene tvoriace chodník */
        .stone-btn {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            border: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            z-index: 10;
            opacity: 0;
            user-select: none;
            outline: none;
            transition: filter var(--transition-speed) ease;
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.75));
        }

        /* Text na kameňoch */
        .stone-btn span {
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(8px, 0.72vw, 13px);
            font-weight: 600;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1.6px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 1), 0 0 12px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            white-space: nowrap;
            padding: 2px 6px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .stone-btn:hover,
        .stone-btn:focus-visible {
            --scale: 1.14;
            filter: drop-shadow(0 0 22px rgba(226, 184, 107, 0.85)) brightness(1.2);
            z-index: 100;
        }

        .stone-btn:hover span,
        .stone-btn:focus-visible span {
            color: var(--gold-light);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 16px rgba(226, 184, 107, 0.9);
        }

        @keyframes floatEffect {
            0% { transform: rotate(var(--rot)) scale(var(--scale, 1)) translateY(0px); }
            50% { transform: rotate(var(--rot)) scale(var(--scale, 1)) translateY(-4px); }
            100% { transform: rotate(var(--rot)) scale(var(--scale, 1)) translateY(0px); }
        }

        .is-floating {
            animation: floatEffect 4.5s ease-in-out infinite;
        }

        @keyframes stoneAppear {
            from { opacity: 0; transform: rotate(var(--rot)) scale(0.3); }
            to { opacity: 1; transform: rotate(var(--rot)) scale(var(--scale, 1)); }
        }

        /* =========================================================
           MALÉ VYSKAKOVACIE OKNO + ČISTÉ VIDITEĽNÉ POZADIE ZA NÍM
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            /* Úplne priehľadné pozadie - ilustrácia za oknom zostáva krásne viditeľná */
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Omnoho menšia, decentná sklenená kartička */
        .modal-content {
            position: relative;
            background: linear-gradient(160deg, rgba(15, 22, 38, 0.76) 0%, rgba(8, 12, 22, 0.84) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 22px;
            padding: 26px 24px 22px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            color: var(--text-light);
            box-shadow: 
                0 20px 45px rgba(0, 0, 0, 0.65),
                0 0 30px rgba(226, 184, 107, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(15px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        /* Malé tlačidlo zatvorenia */
        .close-modal {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-soft);
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .close-modal:hover {
            background: rgba(226, 184, 107, 0.2);
            border-color: var(--gold-primary);
            color: var(--gold-light);
            transform: rotate(90deg);
        }

        /* Nadpis v okne */
        .modal-body h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 0.4px;
            line-height: 1.15;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #fef3c7 60%, #e2b86b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Jemný oddeľovač */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 12px;
            width: 90px;
            color: var(--gold-primary);
            font-size: 9px;
            opacity: 0.8;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        /* Kompaktný popis */
        .modal-body p {
            font-size: 13.5px;
            font-weight: 300;
            line-height: 1.65;
            color: var(--text-soft);
            margin-bottom: 16px;
        }

        /* Malé elegantné štítky */
        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }

        .tag-badge {
            font-size: 10.5px;
            font-weight: 400;
            letter-spacing: 0.4px;
            padding: 4px 11px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(226, 184, 107, 0.3);
            color: var(--gold-light);
        }

        /* Tlačidlo akcie */
        .modal-action {
            display: flex;
            justify-content: center;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #090d16;
            background: linear-gradient(135deg, #fef3c7 0%, #e2b86b 50%, #d49b35 100%);
            padding: 9px 22px;
            border-radius: 40px;
            box-shadow: 0 6px 18px rgba(226, 184, 107, 0.25);
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(226, 184, 107, 0.4);
        }

        @media (max-width: 768px) {
            .site-header { top: 12px; left: 16px; }
            .site-header h1 { font-size: 22px; }
            .modal-content { max-width: 290px; padding: 22px 18px 18px; }
            .modal-body h2 { font-size: 24px; }
            .modal-body p { font-size: 12.5px; }
        }

        @media (max-width: 600px) and (orientation: portrait) {
            html, body {
                height: auto;
                min-height: 100%;
                overflow-x: hidden;
                overflow-y: auto;
            }

            body {
                display: block;
            }

            .site-header { top: 10px; left: 14px; }
            .site-header h1 { font-size: 20px; }

            .portfolio-stage {
                width: 100%;
                height: max(1050px, 145svh);
                max-width: none;
                max-height: none;
                margin-top: 54px;
                background-size: cover;
                background-position: 70% center;
                box-shadow: none;
            }

            .stone-btn span {
                font-size: clamp(8px, 2.4vw, 11px);
                letter-spacing: 0.6px;
                padding: 2px;
                white-space: normal;
            }

            .modal-overlay { padding: 14px; }
            .modal-content {
                max-width: 360px;
                max-height: calc(100dvh - 28px);
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <h1>Lucia <span>Danielová</span></h1>
    </header>

    <main class="portfolio-stage" id="stage" aria-label="Interaktívna mapa portfólia"></main>

    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="close-modal" id="close-btn" aria-label="Zavrieť okno">&times;</button>
            <div class="modal-body">
                <h2 id="modal-title">Názov sekcie</h2>
                <div class="divider">✦</div>
                <p id="modal-description">Tu sa zobrazí popis sekcie.</p>
                <div id="modal-tags" class="modal-tags"></div>
                <div id="modal-action" class="modal-action"></div>
            </div>
        </div>
    </div>

    <script>
        /* 
           Kamene sú uložené tak, aby vytvárali chodník perspektívne za postavou 
           po svietiacej ceste smerom k stromu a údoliu (od väčších vpredu po menšie vzadu).
        */
        const stoneConfig = [
            { 
                id: 'stone1', img: 'kamen.svg', label: 'O MNE', 
                size: 155, bottom: 2, left: 82, rotate: -6,
                title: 'O mne',
                desc: 'Volám sa Lucia Danielová. Venujem sa tvorbe kreatívnych a funkčných webových riešení, kde spájam čistý kód s vlastným umeleckým dizajnom.',
                tags: ['Web Developer', 'Kreatívny Dizajn', 'Zmysel pre detail']
            },
            { 
                id: 'stone2', img: 'kamen.svg', label: 'ZRUČNOSTI', 
                size: 142, bottom: 5, left: 71, rotate: -4,
                title: 'Technické Zručnosti',
                desc: 'Ovládam moderné webové technológie na tvorbu responzívnych a interaktívnych stránok, správu verzií cez Git a prácu vo VS Code.',
                tags: ['HTML5', 'CSS3', 'JavaScript', 'VS Code', 'Git & GitHub']
            },
            { 
                id: 'stone3', img: 'kamen.svg', label: 'PROJEKTY', 
                size: 130, bottom: 8, left: 61, rotate: 2,
                title: 'Moje Projekty',
                desc: 'Ukážky mojej doterajšej práce: od interaktívnych JavaScript aplikácií až po toto plne animované autorské portfólio.',
                tags: ['Interaktívne Portfólio', 'JS Aplikácie', 'Responzívne Weby'],
                actionText: 'Môj GitHub', actionLink: 'https://github.com/lucia-danielova'
            },
            { 
                id: 'stone4', img: 'kamen.svg', label: 'SKÚSENOSTI', 
                size: 118, bottom: 12, left: 52, rotate: 6,
                title: 'Skúsenosti & Prax',
                desc: 'Praktické skúsenosti s návrhom architektúry webu od prvotnej grafickej skice v Illustratore až po nasadenie živého kódu.',
                tags: ['Frontend', 'DevTools', 'Optimalizácia grafiky']
            },
            { 
                id: 'stone5', img: 'kamen.svg', label: 'VZDELANIE', 
                size: 108, bottom: 16, left: 43, rotate: 8,
                title: 'Vzdelanie',
                desc: 'Neustále sa vzdelávam v moderných webových technológiách, prístupnosti webu a najnovších trendoch v UI/UX dizajne.',
                tags: ['Samoštúdium', 'Online Kurzy', 'Moderné CSS']
            },
            { 
                id: 'stone6', img: 'kamen.svg', label: 'DIZAJN', 
                size: 98, bottom: 19, left: 34, rotate: 4,
                title: 'Grafický Dizajn',
                desc: 'Vektorová grafika v Adobe Illustrator, tvorba vlastných vizuálnych prvkov, práca s vrstvami a príprava SVG a PNG podkladov.',
                tags: ['Adobe Illustrator', 'SVG Grafika', 'Vizuálna Identita']
            },
            { 
                id: 'stone7', img: 'kamen.svg', label: 'VÍZIA', 
                size: 90, bottom: 17, left: 25, rotate: -5,
                title: 'Záľuby & Vízia',
                desc: 'Spájam technické myslenie s umením. Mojím cieľom je tvoriť weby, ktoré sú skutočným vizuálnym zážitkom pre používateľa.',
                tags: ['Digitálne Umenie', 'Inovácie', 'Kreatívne Kódovanie']
            },
            { 
                id: 'stone8', img: 'kamen.svg', label: 'CERTIFIKÁTY', 
                size: 84, bottom: 14, left: 16, rotate: -10,
                title: 'Certifikáty & Kurzy',
                desc: 'Prehľad mojich absolvovaných kurzov, certifikácií a úspechov v oblasti frontend vývoja webu a grafického dizajnu.',
                tags: ['Frontend Development', 'Responsive Design', 'UI/UX']
            },
            { 
                id: 'stone9', img: 'kamen.svg', label: 'KONTAKT', 
                size: 80, bottom: 11, left: 7, rotate: -14,
                title: 'Kontaktuj ma',
                desc: 'Máš záujem o spoluprácu, hľadáš posilu do tímu alebo máš otázku k mojim projektom? Ozvi sa mi!',
                tags: ['Spolupráca', 'Web na mieru'],
                actionText: 'Napísať e-mail', actionLink: 'mailto:luciadanielova1@gmail.com'
            }
        ];

        const stage = document.getElementById('stage');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-description');
        const modalTags = document.getElementById('modal-tags');
        const modalAction = document.getElementById('modal-action');
        const closeBtn = document.getElementById('close-btn');

        const stoneRatio = 1.5; 
        const scaleMultiplier = 1.25;
        const mobileLayoutQuery = window.matchMedia('(max-width: 600px) and (orientation: portrait)');
        let mobileLayout = mobileLayoutQuery.matches;

        function openModal(item) {
            modalTitle.innerText = item.title || item.label;
            modalDesc.innerText = item.desc || '';

            modalTags.innerHTML = '';
            if (item.tags && item.tags.length > 0) {
                item.tags.forEach(tagText => {
                    const span = document.createElement('span');
                    span.className = 'tag-badge';
                    span.innerText = tagText;
                    modalTags.appendChild(span);
                });
            }

            modalAction.innerHTML = '';
            if (item.actionText && item.actionLink) {
                const link = document.createElement('a');
                link.className = 'action-btn';
                link.href = item.actionLink;
                if (item.actionLink.startsWith('http')) {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                }
                link.innerText = item.actionText;
                modalAction.appendChild(link);
            }

            modalOverlay.classList.add('active');
            modalOverlay.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            modalOverlay.setAttribute('aria-hidden', 'true');
        }

        function buildPortfolio() {
            stage.innerHTML = '';

            stoneConfig.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'stone-btn';
                btn.id = item.id;
                btn.setAttribute('aria-label', item.title || item.label);

                const textSpan = document.createElement('span');
                textSpan.innerText = item.label;
                btn.appendChild(textSpan);

                btn.style.backgroundImage = `url('${item.img}'), url('kamenbezpozadia.png')`;

                if (mobileLayout) {
                    btn.style.width = 'clamp(86px, 25vw, 112px)';
                    btn.style.height = 'clamp(76px, 22vw, 98px)';
                    btn.style.left = index % 2 === 0 ? '16%' : '58%';
                    btn.style.top = `${10 + index * 9.4}%`;
                } else {
                    const wPx = item.size * scaleMultiplier;
                    const hPx = wPx * stoneRatio;
                    const wPercent = (wPx / 1920) * 100;
                    const hPercent = (hPx / 1080) * 100;

                    btn.style.width = `${wPercent}%`;
                    btn.style.height = `${hPercent}%`;
                    btn.style.left = `${item.left}%`;
                    btn.style.bottom = `${item.bottom}%`;
                }
                
                const divRotation = 90 + item.rotate;
                btn.style.setProperty('--rot', `${divRotation}deg`);
                
                const spanRotation = -divRotation;
                textSpan.style.transform = `rotate(${spanRotation}deg)`;

                btn.style.animation = `stoneAppear 0.6s ease-out ${index * 0.08}s forwards`;

                setTimeout(() => {
                    btn.classList.add('is-floating');
                }, (index * 80) + 600);

                btn.addEventListener('click', () => {
                    openModal(item);
                });

                stage.appendChild(btn);
            });
        }

        closeBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        mobileLayoutQuery.addEventListener('change', (event) => {
            mobileLayout = event.matches;
            buildPortfolio();
        });
        window.addEventListener('DOMContentLoaded', buildPortfolio);
    </script>
</body>
</html>
